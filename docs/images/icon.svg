<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#16224e"/>
      <stop offset="0.55" stop-color="#2b45a8"/>
      <stop offset="1" stop-color="#4c72f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#7ea6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7ea6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e6ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <g transform="translate(104 168) scale(1.72)">
    <!-- tail flukes, drawn first so the body covers the joint -->
    <path d="M104 74c22-20 44-26 58-22-8 10-10 20-5 30 5 10 13 16 22 20-18 10-44 4-60-10z" fill="#f2f7ff"/>
    <!-- body -->
    <path d="M18 82c0-30 27-52 62-52 36 0 63 21 63 49 0 10-3 18-9 25 12 3 20 10 24 19-14 2-26-1-35-8-12 9-28 15-47 15-36 0-58-21-58-48z" fill="url(#body)"/>
    <!-- eye -->
    <circle cx="62" cy="74" r="7" fill="#0d1738"/>
    <circle cx="64.4" cy="71.2" r="2.4" fill="#ffffff"/>
    <!-- spout -->
    <g fill="#c6d9ff">
      <circle cx="88" cy="16" r="5.4"/>
      <circle cx="103" cy="6" r="4"/>
      <circle cx="112" cy="22" r="3.2"/>
    </g>
  </g>
</svg>
